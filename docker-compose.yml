services:
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      NEBIUS_API_KEY: "${NEBIUS_API_KEY:-}"
      NEBIUS_BASE_URL: "${NEBIUS_BASE_URL:-https://api.studio.nebius.com/v1}"
      NEBIUS_NARRATION_MODEL: "${NEBIUS_NARRATION_MODEL:-nvidia/Nemotron-3-Nano-Omni}"
      NEBIUS_DIALOGUE_MODEL: "${NEBIUS_DIALOGUE_MODEL:-Qwen/Qwen3-VL-32B-Instruct}"
      GUIDELENS_DEVICE_TOKENS_PER_HOUR: "${GUIDELENS_DEVICE_TOKENS_PER_HOUR:-250000}"
      GUIDELENS_DEVICE_IDS: "${GUIDELENS_DEVICE_IDS:-}"
      SUPERMEMORY_API_KEY: "${SUPERMEMORY_API_KEY:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
    restart: unless-stopped
