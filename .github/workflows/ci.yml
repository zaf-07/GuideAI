name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r gateway/requirements-dev.txt
      - name: Test
        working-directory: gateway
        run: pytest -q

  core:
    name: GuideLensCore
    # macOS runners ship a full Xcode, so XCTest and the iOS SDK are
    # available here even when the developer's own machine has neither.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: ios/GuideLensCore
        run: swift build
      - name: Check the decision rules
        working-directory: ios/GuideLensCore
        run: swift run GuideLensChecks

  app:
    name: iOS app
    runs-on: macos-15
    # The SwiftUI client needs Xcode, so this job is the only place it is
    # built in CI. It is not a substitute for a device: the simulator has no
    # LiDAR, no real camera and misleading audio timing, so no latency number
    # from here is valid for any acceptance criterion.
    steps:
      - uses: actions/checkout@v4
      - name: Build for the simulator
        working-directory: ios
        # `-scheme`, not `-target`: Swift package dependencies are resolved
        # through the scheme, and `-target` fails to find the GuideLensCore
        # module even though the package itself compiles.
        run: |
          xcodebuild build \
            -project VisionMate.xcodeproj \
            -scheme VisionMate \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
      - name: Build for a device
        working-directory: ios
        run: |
          xcodebuild build \
            -project VisionMate.xcodeproj \
            -scheme VisionMate \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO
